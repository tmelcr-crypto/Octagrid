<title>Octagrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: drafting-table app. Tool rail left, big canvas, context strip below. Light = paper plan, dark = night plan. */
:root{
  --bg:#e6e9e0; --panel:#f7f6f0; --panel2:#ecebe3; --ink:#1c2226; --dim:#667078; --line:#c6cabd;
  --accent:#ff5a1f; --accent-ink:#ffffff; --good:#2f9e5b; --bad:#d6322b;
  --ground:#e3e7da; --grid:#d3d9c8; --gridM:#bcc5ad; --road:#3b424a; --walk:#c9ccc0; --mark:#f4f1e4;
  --park:#b7d29c; --water:#9bc6de; --sand:#e6dbb0; --shadow:rgba(30,40,30,.22);
  --f-d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --f-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181c; --panel:#222a30; --panel2:#2a343b; --ink:#e7ebe4; --dim:#8d99a0; --line:#38434a;
  --accent:#ff7a3d; --accent-ink:#1a1a1a; --good:#4cc47f; --bad:#ff6259;
  --ground:#1c2227; --grid:#262f35; --gridM:#323d45; --road:#0e1215; --walk:#444d54; --mark:#d8d6c6;
  --park:#2f4a38; --water:#1f4a66; --sand:#5d5a49; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181c; --panel:#222a30; --panel2:#2a343b; --ink:#e7ebe4; --dim:#8d99a0; --line:#38434a;
  --accent:#ff7a3d; --accent-ink:#1a1a1a; --good:#4cc47f; --bad:#ff6259;
  --ground:#1c2227; --grid:#262f35; --gridM:#323d45; --road:#0e1215; --walk:#444d54; --mark:#d8d6c6;
  --park:#2f4a38; --water:#1f4a66; --sand:#5d5a49; --shadow:rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.2 var(--f-d);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:auto minmax(0,1fr)}
#top{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font-weight:700;font-size:24px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-right:10px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.sp{flex:1;min-width:6px}
.ib{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib svg,.tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active,.tool:active{background:var(--panel2)}
.ib[disabled]{opacity:.3}
.ib.on{background:var(--panel2);color:var(--accent)}
.pill{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:19px;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px}
.pill.act{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill b{color:var(--accent);font-weight:700}
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto;scrollbar-width:none}
.tool{width:60px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);flex:none}
.tool.on{background:var(--accent);color:var(--accent-ink)}
#stage{position:relative;min-width:0;min-height:0;background:var(--ground)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:400 12px/1.35 var(--f-m);color:var(--dim);pointer-events:none;text-align:right}
#hud b{color:var(--ink);font-weight:500}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:15px;letter-spacing:.03em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90%}
#toast.show{opacity:1}
#strip{grid-column:1/3;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:stretch;gap:6px;max-height:36vh;overflow-y:auto;scrollbar-width:none}
.srow{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;flex:none;padding:1px}
.srow::-webkit-scrollbar{display:none}
#strip::-webkit-scrollbar{display:none}
.chip{height:46px;min-width:64px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;flex:none;background:var(--panel)}
.chip small{font:400 11px var(--f-m);color:var(--dim);letter-spacing:0;text-transform:none}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}
.chip i{width:18px;height:18px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.25);flex:none}
.chip.act{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.chip[disabled]{opacity:.35}
.vchip{min-width:52px;padding:0 8px;gap:6px;font:500 14px var(--f-m);height:44px}
.vchip i{width:22px;height:22px}
.tool{width:60px;height:56px}
.lab{font:400 11px var(--f-m);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;flex:none}
.hint{color:var(--dim);font-size:16px;white-space:nowrap;flex:none}
.step{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;flex:none;overflow:hidden;height:46px}
.step button{width:46px;height:100%;font-size:24px;display:grid;place-items:center}
.step button:active{background:var(--panel2)}
.step span{min-width:62px;text-align:center;font:500 14px var(--f-m)}
.step em{display:block;font:400 10px var(--f-m);color:var(--dim);font-style:normal;text-transform:uppercase;letter-spacing:.08em}
.vr{width:1px;align-self:stretch;background:var(--line);margin:4px 2px;flex:none}
#dlg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:5}
#dlg[hidden]{display:none}
#dlg .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);padding:16px;display:flex;flex-direction:column;gap:10px;max-height:90%}
#dlg h2{margin:0;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
#dlg p{margin:0;color:var(--dim);font-size:16px}
#dlg textarea{width:100%;height:160px;resize:none;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:400 12px/1.4 var(--f-m);padding:8px;-webkit-user-select:text;user-select:text}
#dlg .row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:1300px){.brand span{display:none}.pill{font-size:13px;padding:0 9px;letter-spacing:.02em}#top{gap:4px;padding:6px 8px}}
@media (max-width:640px){.tool{width:52px;height:56px;font-size:11px}.brand span{display:none}.hint{font-size:15px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <div id="top">
    <div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"><path d="M16 3v26M3 16h26M7 7l18 18M25 7L7 25"/><circle cx="16" cy="16" r="3.2" fill="var(--panel)"/></svg><span>Octagrid</span></div>
    <button class="pill" id="bUndo" aria-label="Step back">↶ Step back</button>
    <button class="ib" id="bRedo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 7h4v4"/><path d="M18.5 11A8 8 0 1 0 16 17.5"/></svg></button>
    <div class="sp"></div>
    <button class="pill" id="bLimit" aria-label="City limit"></button>
    <button class="pill" id="bEdge" aria-label="City edge"></button>
    <button class="pill" id="bFinger" aria-label="Finger mode"></button>
    <button class="ib on" id="bGrid" aria-label="Grid"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 12h16M12 4v16"/></svg></button>
    <button class="ib" id="bOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="ib" id="bIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <button class="ib" id="bFit" aria-label="Fit city"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="pill" id="bSave" aria-label="Save online">Save</button>
    <button class="pill act" id="bExport">Export map</button>
    <button class="ib" id="bData" aria-label="City data"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg></button>
  </div>
  <div id="rail"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="dlg" hidden><div class="card">
      <h2>City data</h2>
      <p>Copy this text to keep your city, or paste a saved city and load it. Your city also saves itself in this browser.</p>
      <textarea id="dtxt" spellcheck="false"></textarea>
      <div class="row">
        <button class="chip act" id="dCopy">Copy</button>
        <button class="chip" id="dLoad">Load text</button>
        <button class="chip" id="dNew">New city</button>
        <button class="chip" id="dClose">Close</button>
      </div>
    </div></div>
  </div>
  <div id="strip"></div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
let W=1,H=1,dpr=1,dirty=true;
const cam={x:0,y:0,s:26};
const FH=0.16;               // floor height in cells, drawn compressed
const M_PER_CELL=10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rad=d=>d*Math.PI/180;

/* ---------- catalogue (mirrors Block Runner) ---------- */
const VCOL=['#ff3fb4','#35d8ff','#8a5cff','#ffb02e','#3dffa6','#ff4d6d','#4d7aff','#b79cff','#ff7a3d','#2bf3ff','#ffe14a','#ff2bd6','#6f86ff','#ffd0a0','#9fb8d8'];
const RT={lane:{w:.6,n:'Lane',m:'6 m'},street:{w:1,n:'Street',m:'10 m'},avenue:{w:1.7,n:'Avenue',m:'17 m'}};
/* each building type: base footprint, base floors, floors per variant step, cap = most floors Block Runner builds for that kind */
const TYPES={
  brick:    {n:'Brick',     kind:'solid',w:2,d:2,f0:2, fs:1,cap:6, tint:'#b5654a',runner:'brick'},
  apartment:{n:'Flats',     kind:'solid',w:3,d:2,f0:4, fs:1,cap:8, tint:'#cdb99a',runner:'apartment'},
  office:   {n:'Office',    kind:'solid',w:3,d:3,f0:6, fs:2,cap:30,tint:'#8a8d97',runner:'office'},
  shop:     {n:'Shops',     kind:'solid',w:3,d:2,f0:1, fs:0,cap:2, tint:'#e8c45e',runner:'office'},
  warehouse:{n:'Warehouse', kind:'solid',w:4,d:3,f0:2, fs:0,cap:3, tint:'#b9bcc4',runner:'warehouse'},
  glass:    {n:'Glass',     kind:'solid',w:2,d:2,f0:14,fs:2,cap:40,tint:'#9fb8d8',runner:'glass'},
  deco:     {n:'Deco',      kind:'solid',w:3,d:3,f0:12,fs:2,cap:40,tint:'#d9c27a',runner:'deco'},
  park:     {n:'Park',      kind:'park',w:4,d:4,tint:'#8fbf6e'},
  water:    {n:'Pond',      kind:'water',w:4,d:3,tint:'#7fb6d4'}
};
const SOLIDS=['brick','apartment','office','shop','warehouse','glass','deco'];
const VD=[[0,0,0],[1,0,1],[0,1,2],[1,1,3],[2,0,0],[0,2,1],[2,1,2],[1,2,3],[2,2,4],[3,0,1],[0,3,2],[3,1,3],[1,3,4],[3,2,5],[3,3,6]];
function variant(type,v){const T=TYPES[type],d=VD[v%15];
  let fl=T.f0+(T.fs?d[2]*T.fs:(d[2]%2)); fl=clamp(fl,1,T.cap||40);
  return {w:clamp(T.w+d[0],1,14),d:clamp(T.d+d[1],1,14),fl};}
const OLDTYPE={house:'brick',tower:'glass',factory:'warehouse'};
const CAR={sedan:{n:'Sedan',len:54,wid:26,cols:['#ff2bd6','#2bf3ff','#a259ff','#ffe14a','#3dffa6','#6f86ff']},
  sports:{n:'Sports',len:52,wid:24,cols:['#ff2bd6','#ffe14a','#2bf3ff','#ff4d4d']},
  truck:{n:'Truck',len:78,wid:33,cols:['#3d6fff','#ff7a3d','#3dffa6','#b79cff']},
  police:{n:'Police',len:54,wid:26,cols:['#171a24']}};
const OBJS=[['lamp','Lamp'],['sedan','Sedan'],['sports','Sports'],['truck','Truck'],['police','Police'],['health','Health'],['pistol','Pistol'],['mg','MG'],['cash','Cash'],['ped','Walker'],['cop','Cop'],['start','Start']];
const AREAS=[['water','Pond'],['park','Park'],['sand','Beach'],['bld','Building'],['zone','District']];
const ZP={homes:{n:'Homes',grid:8,road:'street',types:['brick','brick','brick','apartment','shop'],dens:.5,trees:.12,cars:1},
  downtown:{n:'Downtown',grid:9,road:'street',types:['glass','office','deco','shop','apartment','glass'],dens:.6,trees:.04,cars:2},
  industry:{n:'Industry',grid:10,road:'street',types:['warehouse','warehouse','warehouse','office'],dens:.4,trees:.03,cars:1},
  green:{n:'Green',grid:0,types:[],dens:0,trees:.45,cars:0}};

let S={r:[],b:[],t:[],a:[],o:[],z:[],n:48,e:{n:'wall',s:'wall',e:'lake',w:'lake'}};
const SIZES=[32,48,64,96];
const outside=(x,y)=>Math.abs(x)>S.n/2+1e-6||Math.abs(y)>S.n/2+1e-6;
let undoS=[],redoS=[],sel=null,tool='road',roadType='street',buildType='brick',treeKind='oak',objKind='lamp',areaKind='water';
let ghostRot=0,ghostVar={},ghostSz={},pending=null,hov=null,penSeen=false,fingerDraw=true,showGrid=true,spaceDown=false;
let areaPts=[],areaMode='dots',areaLock=true,objCol=0,nodes=[],roadCurve=false,curvePts=[];

/* ---------- geometry ---------- */
function corners(b){const c=Math.cos(rad(b.rot)),s=Math.sin(rad(b.rot)),hw=b.w/2,hd=b.d/2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x,y])=>[b.x+x*c-y*s,b.y+x*s+y*c]);}
const shapeOf=o=>o.pts||corners(o);
const kindOf=o=>o.pts?(o.k==='bld'?'solid':o.k):o.kind;
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const a=poly[i],b=poly[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function distEdges(p,P){let m=1e9;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1;
  const t=clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l,0,1);m=Math.min(m,Math.hypot(p[0]-a[0]-dx*t,p[1]-a[1]-dy*t));}return m;}
const distPoly=(P,x,y)=>inPoly([x,y],P)?0:distEdges([x,y],P);
const insideStrict=(p,P)=>inPoly(p,P)&&distEdges(p,P)>0.03;
const orient=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
function segCross(a,b,c,d){const e=1e-7,d1=orient(a,b,c),d2=orient(a,b,d),d3=orient(c,d,a),d4=orient(c,d,b);
  return ((d1>e&&d2<-e)||(d1<-e&&d2>e))&&((d3>e&&d4<-e)||(d3<-e&&d4>e));}
function bbox(P){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of P){a=Math.min(a,p[0]);c=Math.max(c,p[0]);b=Math.min(b,p[1]);d=Math.max(d,p[1]);}return [a,b,c,d];}
function probes(P){const o=[];let cx=0,cy=0;for(let i=0;i<P.length;i++){const q=P[(i+1)%P.length];o.push(P[i],[(P[i][0]+q[0])/2,(P[i][1]+q[1])/2]);cx+=P[i][0];cy+=P[i][1];}o.push([cx/P.length,cy/P.length]);return o;}
function polysOverlap(P,Q){
  const A=bbox(P),B=bbox(Q);if(A[2]<=B[0]||B[2]<=A[0]||A[3]<=B[1]||B[3]<=A[1])return false;
  for(let i=0;i<P.length;i++)for(let j=0;j<Q.length;j++)if(segCross(P[i],P[(i+1)%P.length],Q[j],Q[(j+1)%Q.length]))return true;
  for(const p of probes(P))if(insideStrict(p,Q))return true;
  for(const q of probes(Q))if(insideStrict(q,P))return true;
  return false;}
function area(P){let a=0;for(let i=0;i<P.length;i++){const q=P[(i+1)%P.length];a+=P[i][0]*q[1]-q[0]*P[i][1];}return a/2;}
function centroid(P){let x=0,y=0;for(const p of P){x+=p[0];y+=p[1];}return [x/P.length,y/P.length];}
function simplePoly(P){const n=P.length;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(j===i+1||(i===0&&j===n-1))continue;
  if(segCross(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return false;}return true;}
const plCache=new WeakMap();
function pl(r){                 /* a road as a list of points: straight = 2, curved = flattened quadratic curve */
  if(!r.c)return [r.a,r.b];
  const k=r.a[0]+','+r.a[1]+','+r.c[0]+','+r.c[1]+','+r.b[0]+','+r.b[1],e=plCache.get(r);if(e&&e.k===k)return e.p;
  const n=Math.max(8,Math.ceil((Math.hypot(r.c[0]-r.a[0],r.c[1]-r.a[1])+Math.hypot(r.b[0]-r.c[0],r.b[1]-r.c[1]))/.35)),p=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;p.push([u*u*r.a[0]+2*u*t*r.c[0]+t*t*r.b[0],u*u*r.a[1]+2*u*t*r.c[1]+t*t*r.b[1]]);}
  plCache.set(r,{k,p});return p;}
function samples(r){const P=pl(r),o=[];
  for(let s=0;s<P.length-1;s++){const dx=P[s+1][0]-P[s][0],dy=P[s+1][1]-P[s][1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/.2));
    for(let i=s?1:0;i<=n;i++)o.push([P[s][0]+dx*i/n,P[s][1]+dy*i/n]);}
  return o;}
function distSeg(r,x,y){const P=pl(r);let m=1e9;
  for(let s=0;s<P.length-1;s++){const a=P[s],b=P[s+1],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1;
    const t=clamp(((x-a[0])*dx+(y-a[1])*dy)/l,0,1);m=Math.min(m,Math.hypot(x-a[0]-dx*t,y-a[1]-dy*t));}
  return m;}
function roadLen(r){const P=pl(r);let L=0;for(let i=0;i<P.length-1;i++)L+=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);return L;}
const allShapes=()=>S.b.concat(S.a);
function kindClash(a,b){if(a==='sand'||b==='sand')return false;return a==='solid'||b==='solid'||a!==b;}
function conflictShape(P,kind,ign){
  if(P.some(p=>outside(p[0],p[1])))return 'Outside the city limit';
  for(const o of allShapes()){if(o===ign)continue;
    if(kindClash(kind,kindOf(o))&&polysOverlap(P,shapeOf(o)))return 'Overlaps something';}
  if(kind==='solid')for(const r of S.r){const hw=RT[r.t].w/2-.02;
    for(const p of samples(r))if(distPoly(P,p[0],p[1])<hw)return 'Blocked by a road';}
  return null;}

  else if(a==='bw+'||a==='bw-'||a==='bd+'||a==='bd-'||a==='bf+'||a==='bf-'){
    const z=ghostSz[buildType]||(ghostSz[buildType]={...variant(buildType,ghostVar[buildType]||0)});
    if(a[1]==='w')z.w=clampSz(z.w+sg);else if(a[1]==='d')z.d=clampSz(z.d+sg);else z.fl=clamp(z.fl+sg,1,TYPES[buildType].cap||40);renderStrip();dirty=true;}
  else if(a==='sw+'||a==='sw-')mutate(o=>{o.w=clampSz(o.w+sg);});
  else if(a==='sd+'||a==='sd-')mutate(o=>{o.d=clampSz(o.d+sg);});
  else if(a==='sf+'||a==='sf-')mutate(o=>{o.fl=clamp(o.fl+sg,1,TYPES[o.type].cap||40);});
  else if(a==='srl')mutate(o=>{o.rot=(o.rot+315)%360;});
  else if(a==='srr')mutate(o=>{o.rot=(o.rot+45)%360;});
  else if(a==='sdel')del();
  else if(a==='zgen'&&sel&&sel.k==='z')genZone(sel.o);
  else if(a==='sdup')dup();});
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
$('#bGrid').onclick=()=>{showGrid=!showGrid;syncBtns();dirty=true;};
$('#bFinger').onclick=()=>{fingerDraw=!fingerDraw;syncBtns();toast(fingerDraw?'Fingers draw':'Fingers pan and zoom');};
$('#bIn').onclick=()=>{cam.s=clamp(cam.s*1.25,8,90);dirty=true;};
$('#bOut').onclick=()=>{cam.s=clamp(cam.s/1.25,8,90);dirty=true;};
$('#bFit').onclick=fit;
function limitLabel(){$('#bLimit').innerHTML='Limit <b>'+S.n*M_PER_CELL+' m</b>';$('#bEdge').innerHTML='Edge <b>'+edgeName()+'</b>';}
$('#bEdge').onclick=()=>{let i=EDGE_STYLES.findIndex(st=>st[4]===edgeName());const st=EDGE_STYLES[(i+1)%EDGE_STYLES.length],prev=snap();S.e={n:st[0],s:st[1],e:st[2],w:st[3]};push(prev);changed();toast('City edge: '+st[4]+(st[4]==='Mixed'?' (lake east and west)':''));};
$('#bLimit').onclick=()=>{
  const i=SIZES.indexOf(S.n),nx=SIZES[(i+1)%SIZES.length],need=contentHalf(S);
  const big=nx/2<need;
  const prev=snap();S.n=big?SIZES[SIZES.length-1]:nx;push(prev);changed();fit();
  toast(big?'Your city is bigger than '+nx*M_PER_CELL+' m, so the limit stays at '+S.n*M_PER_CELL+' m':'City limit '+S.n*M_PER_CELL+' × '+S.n*M_PER_CELL+' m');};
function fit(){const h=S.n/2+3;cam.x=0;cam.y=0;cam.s=clamp(Math.min(W/(2*h),H/(2*h)),8,60);dirty=true;}
/* data dialog */
let newArm=false;
$('#bData').onclick=()=>{$('#dtxt').value=snap();$('#dlg').hidden=false;newArm=false;$('#dNew').textContent='New city';$('#dNew').classList.remove('bad');};
$('#dClose').onclick=()=>{$('#dlg').hidden=true;};
$('#dCopy').onclick=async()=>{const t=$('#dtxt');try{await navigator.clipboard.writeText(t.value);toast('Copied');}catch(e){t.focus();t.select();toast('Press Copy on the selected text');}};
$('#dLoad').onclick=()=>{try{const prev=snap();loadStr($('#dtxt').value);push(prev);$('#dlg').hidden=true;fit();toast('City loaded');}catch(e){toast('That text is not a saved city');}};
$('#dNew').onclick=()=>{
  if(!newArm){newArm=true;$('#dNew').textContent='Tap again to clear';$('#dNew').classList.add('bad');return;}
  const prev=snap();S={r:[],b:[],t:[],a:[],o:[],z:[],n:S.n,e:S.e};sel=null;push(prev);changed();$('#dlg').hidden=true;fit();};
/* export for Block Runner: simplified shapes here, full detail is rebuilt there */
function exportMap(){
  const r2=v=>Math.round(v*100)/100;
  return {format:'octagrid-city',version:2,name:'Octagrid city',cellMeters:M_PER_CELL,bounds:{x0:-S.n/2,y0:-S.n/2,x1:S.n/2,y1:S.n/2},edges:{...S.e},edgeDepth:EDGE_D,
    note:'Units are grid cells (1 cell = 10 m). x grows east, y grows south. rot is degrees clockwise in 45 degree steps. Buildings carry type, variant (0-14) and seed so Block Runner can rebuild the full detailed version.',
    roads:S.r.map(r=>({a:r.a.slice(),b:r.b.slice(),type:r.t,width:RT[r.t].w,...(r.c?{control:r.c.slice()}:{}),points:pl(r).map(q=>[r2(q[0]),r2(q[1])])})),
    buildings:S.b.filter(b=>b.kind==='solid').map(b=>({type:b.type,variant:b.v,seed:b.seed,x:r2(b.x),y:r2(b.y),w:b.w,d:b.d,rot:b.rot,floors:b.fl})),
    parks:S.b.filter(b=>b.kind==='park').map(b=>({x:r2(b.x),y:r2(b.y),w:b.w,d:b.d,rot:b.rot})),
    water:S.b.filter(b=>b.kind==='water').map(b=>({x:r2(b.x),y:r2(b.y),w:b.w,d:b.d,rot:b.rot})),
    areas:S.a.map(a=>({kind:a.k==='bld'?'building':a.k,points:a.pts.map(p=>[r2(p[0]),r2(p[1])]),...(a.k==='bld'?{type:a.type,variant:a.v||0,floors:a.fl,seed:a.seed}:{})})),
    trees:S.t.map(t=>({x:r2(t.x),y:r2(t.y),kind:t.k})),
    props:S.o.map(o=>{const T=CAR[o.k];return {kind:o.k,x:r2(o.x),y:r2(o.y),rot:o.rot,...(T?{color:T.cols[o.c%T.cols.length]}:(o.k==='ped'?{color:VCOL[(o.c||0)%15]}:{}))};})};}
$('#bExport').onclick=async()=>{
  if(!S.r.length&&!S.b.length&&!S.a.length){toast('Nothing to export yet');return;}
  const txt=JSON.stringify(exportMap());
  let dl=null;try{dl=await claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:'blockrunner-map.json',data:txt});toast('Map file saved');return;}
    catch(e){if(e&&e.code==='declined')return;}}
  $('#dtxt').value=txt;$('#dlg').hidden=false;toast('Saving a file is not available here. Copy the text instead.');};
/* keys */
addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){spaceDown=true;e.preventDefault();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(e.key==='Escape'){pending=null;curvePts=[];areaPts=[];sel=null;renderStrip();dirty=true;}
  if(e.key==='Enter'&&tool==='area')closeArea();
  if((e.key==='Delete'||e.key==='Backspace')&&sel)del();
  if(e.key.toLowerCase()==='r'){if(sel&&(sel.k==='b'||sel.k==='o'))mutate(o=>{o.rot=(o.rot+45)%360;});else{ghostRot=(ghostRot+45)%360;renderStrip();dirty=true;}}
  const map={'1':'select','2':'road','3':'build','4':'area','5':'obj','6':'trees','7':'erase','8':'pan'};if(map[e.key])setTool(map[e.key]);});
addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false;});

/* ---------- boot ---------- */
function resize(){const r=$('#stage').getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2.5);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);dirty=true;}
new ResizeObserver(resize).observe($('#stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);
new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
readTheme();
let loaded=false;
try{const v=localStorage.getItem(KEY)||localStorage.getItem(KEY1);if(v){loadStr(v);loaded=true;}}catch(e){}
if(!loaded){seed();changed();}
undoS=[];redoS=[];resize();fit();renderRail();renderStrip();syncBtns();stats();
/* online save: one shared city document in the artifact db, loaded the same on every device */
let cloud=null,cloudStamp=0;
async function cloudInit(){
  try{const db=await claude.use('db');if(!db){$('#bSave').hidden=true;return;}cloud=db.doc('city/main');
    const sn=await cloud.get();
    if(sn.exists){const d=sn.data();cloudStamp=d.savedAt||0;
      if(d.json&&!undoS.length){try{loadStr(d.json);undoS=[];redoS=[];fit();toast('Loaded your saved city');}catch(e){}}}
  }catch(e){cloud=null;}
}
$('#bSave').onclick=async()=>{
  if(!cloud){toast('Online save is not available here');return;}
  const b=$('#bSave');b.disabled=true;b.textContent='Saving…';
  try{cloudStamp=Date.now();await cloud.set({json:snap(),savedAt:cloudStamp,name:'Octagrid city'});toast('Saved online · opens the same on every device');}
  catch(e){toast('Could not save online');}
  b.disabled=false;b.textContent='Save';};
cloudInit();
window.__oct={get S(){return S;},fillVoid,setTool,exportMap,commitArea,closeArea,toS,cam,get W(){return W;}};
loop();
})();
</script>
